<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrivAI Pocket — Collega questo computer</title>
<meta property="og:title" content="🔒 Collega questo computer a PrivAI Pocket">
<meta property="og:description" content="Apri questo link sul computer che vuoi collegare al telefono, sulla stessa rete Wi-Fi.">
<style>
  @font-face {
    font-family: "Willy Rounded";
    src: url("../assets/fonts/willy-rounded.otf") format("opentype");
    font-weight: 400 900;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    display: grid; place-items: center; text-align: center;
    font-family: "Willy Rounded", ui-rounded, system-ui, sans-serif;
    background: linear-gradient(160deg, #FF6B00 0%, #E85D00 55%, #C94E00 100%);
    background-size: 180% 180%;
    animation: deriva 6s ease-in-out infinite;
    color: #fff;
    padding: 24px;
  }
  .scena { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mascotte {
    width: 96px; height: 96px; object-fit: contain;
    margin-bottom: 6px;
    opacity: 0; transform: scale(.4) translateY(10px);
    animation: entra-mascotte 620ms cubic-bezier(.2, .8, .2, 1) 80ms forwards,
               respira 2.6s ease-in-out 900ms infinite;
  }
  h1 {
    font-size: clamp(28px, 6vw, 44px);
    margin: 0 0 12px;
    opacity: 0;
    transform: translateY(14px);
    animation: entra-testo 500ms ease 420ms forwards;
  }
  p { font-size: 15px; opacity: 0; max-width: 42ch; margin: 0 auto; transform: translateY(10px); }
  #sottotitolo { animation: entra-testo 500ms ease 680ms forwards; }
  #puntini { display: inline-flex; gap: 5px; margin-top: 18px; opacity: 0; animation: entra-testo 400ms ease 900ms forwards; }
  #puntini span {
    width: 6px; height: 6px; border-radius: 50%; background: currentColor;
    animation: rimbalza 1.1s ease-in-out infinite;
  }
  #puntini span:nth-child(2) { animation-delay: .15s; }
  #puntini span:nth-child(3) { animation-delay: .3s; }
  #errore { display: none; margin-top: 20px; font-size: 14px; }

  @keyframes entra-mascotte { to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes respira { 0%, 100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.04) translateY(-3px); } }
  @keyframes entra-testo { to { opacity: .95; transform: none; } }
  @keyframes rimbalza { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
  @keyframes deriva { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    .mascotte, h1, p, #puntini { animation: none !important; opacity: .95; transform: none; }
  }
</style>
</head>
<body>
  <div class="scena">
    <img class="mascotte" src="../assets/willy-welcome.webp" alt="" aria-hidden="true">
    <h1>Eccoti, iniziamo!</h1>
    <p id="sottotitolo">Ti porto sul telefono che ha generato questo link…</p>
    <div id="puntini" aria-hidden="true"><span></span><span></span><span></span></div>
    <p id="errore">Non riesco a raggiungerlo. Controlla che computer e telefono siano sulla stessa rete Wi-Fi (o collegati all'hotspot del telefono), poi riprova dal telefono.</p>
  </div>
  <script>
    (function () {
      var parametri = new URLSearchParams(location.search);
      var ip = parametri.get('ip');
      var porta = parametri.get('porta');
      var token = parametri.get('token');
      if (!ip || !porta || !token) {
        document.getElementById('errore').style.display = 'block';
        return;
      }
      if (!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip) || !/^\d{1,5}$/.test(porta)) {
        document.getElementById('errore').style.display = 'block';
        return;
      }
      var destinazione = 'http://' + ip + ':' + porta + '/?token=' + encodeURIComponent(token);
      // 1400ms invece dei 700 originali: lascia respirare la sequenza
      // (mascotte, titolo, sottotitolo, puntini) prima di saltare via —
      // ancora rapido, non un'attesa vera.
      setTimeout(function () {
        location.href = destinazione;
        // Se il computer non è sulla stessa rete, la navigazione fallisce
        // silenziosamente dal punto di vista di questa pagina (il browser
        // mostra il proprio errore di connessione) — non c'è modo di
        // intercettarlo da qui per mostrare il messaggio sopra invece.
      }, 1400);
    })();
  </script>
</body>
</html>
